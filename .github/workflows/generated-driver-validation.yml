name: Generated driver validation

on:
  pull_request:
    paths:
      - "windows/**"
      - "linux/**"
      - "darwin/**"
      - "_manifest/**"
      - "SHA256SUMS"
      - "provenance.json"
      - ".gitignore"
      - "eng/validate-generated-driver/**"
      - ".github/workflows/generated-driver-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-driver-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Generated integrity and Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Test validator
        run: go test ./eng/validate-generated-driver/main.go ./eng/validate-generated-driver/main_test.go
      - name: Validate generated tree
        run: go run ./eng/validate-generated-driver/main.go integrity -base-ref "${{ github.event.pull_request.base.sha }}"

  native-smoke:
    name: Linux AMD64 ABI smoke
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Link and run native consumer
        run: go run ./eng/validate-generated-driver/main.go native-smoke
